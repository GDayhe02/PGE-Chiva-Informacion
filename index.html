        <style>
        html, body {
            background-color: #ffffff;
        }
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        }
        /* Hover style for features - light burgundy */
        .ol-selectable:hover {
            background-color: rgba(188, 68, 77, 0.15) !important;
            cursor: pointer;
        }
        /* Override OpenLayers hover highlight to burgundy */
        .ol-feature:hover {
            background-color: rgba(188, 68, 77, 0.2) !important;
        }
        .ol-highlighted {
            background-color: rgba(188, 68, 77, 0.2) !important;
        }
        /* Style for selected features */
        svg .ol-layer .feature:hover {
            filter: none !important;
        }
        /* Make layers panel a true popup without displacing map */
        .layer-switcher {
            position: fixed !important;
            top: 50px !important;
            right: 10px !important;
            z-index: 1000 !important;
            background-color: transparent !important;
            border: none !important;
            pointer-events: auto !important;
        }
        .layer-switcher button {
            pointer-events: auto !important;
            z-index: 1001 !important;
            position: relative !important;
        }
        .layer-switcher .panel {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3) !important;
            border-radius: 4px !important;
            max-height: 70vh !important;
            overflow-y: auto !important;
            pointer-events: auto !important;
            position: fixed !important;
            right: 10px !important;
            top: 50px !important;
            z-index: 999 !important;
        }
        /* Hide the layer switcher container background */
        #top-right-container {
            pointer-events: none !important;
        }
        #top-right-container .layer-switcher {
            pointer-events: auto !important;
        }
        #top-right-container .layer-switcher button {
            pointer-events: auto !important;
        }
        </style>

        <style>
        html, body, #map {
